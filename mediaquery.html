<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
     body{
        padding: 1rem 5rem;
    }

    .container{
        display: flex;
        justify-content: space-between;
    }

    .box{
        height: 200px;
        width: 200px;
        background-color: lightgreen;
        border: solid green;
        font-size: 1.5rem;
        font-family: cursive;
        font-weight: 600;
        text-align: center;
        padding-top: 80px;
    }
    @media(max-width: 1360px){
        .box{
            height: 170px;
            width: 170;
            font-size: 1.3rem;
        }
    }
    @media(max-width:1180px){
        .box
            height: 150px;
            width: 150px;
            font-size: 1rem;
            font-size: 1rem;
            background-color: skyblue;
            color: whitesmoke;
            padding-top: 60px;
        }
    }
    @media(max-width:900px){
        .box{
            display: block;
            justify-content: space-around;
            height: 150px;
            width: 150px;
            background-color: goldenrod;
            color: black;
            padding: 30px 30px;
            font-family: cursive;
            font-size: 1.2rem;
            margin: 30px;
        }
        #box-5, #box-6{
            display: none;
        }

        .container{
            flex-wrap: wrap;
        }

        body{
            padding: 0;
        }
    }
    
    </style>
</head>
<body>
    <div class="container">
        
        <div class="box" id="box-1">Box-1</div>
        <div class="box" id="box-2">Box-2</div>
        <div class="box" id="box-3">Box-3</div>
        <div class="box" id="box-4">Box-4</div>
        <div class="box" id="box-5">Box-5</div>
        <div class="box" id="box-6">This is Box-6</div>
    </div>
</body>
</html>
