<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box-1 {

            border: solid;
            width: 200px;
            height: 200px;
            margin: 8rem auto;
            font-family: cursive;
            font-size: 2rem;
            padding-top: 70px;
            text-align: center;
            font-weight: 600;
            font-style: italic;
            border-radius: 10px;
            background-color: lightpink;
            box-shadow: 10px 10px  red;


        }
        .box-2 {

            border: solid;
            width: 200px;
            height: 200px;
            margin: 8rem auto;
            font-family: cursive;
            font-size: 2rem;
            padding-top: 70px;
            text-align: center;
            font-weight: 600;
            font-style: italic;
            border-radius: 10px;
            background-color: yellowgreen;
            box-shadow: -10px -10px yellow;
        }
        .box-3 {

            border: 0px;
            width: 200px;
            height: 200px;
            margin: 8rem auto;
            font-family: cursive;
            font-size: 2rem;
            padding-top: 70px;
            text-align: center;
            font-weight: 600;
            font-style: italic;
            border-radius: 10px;
            margin-bottom: 30px;
            background-color: lightpink;
            box-shadow: -50px -20px red;
        }
        .box-4 {

            border: solid;
            width: 200px;
            height: 200px;
            margin: 8rem auto;
            font-family: cursive;
            font-size: 2rem;
            padding-top: 70px;
            text-align: center;
            font-weight: 600;
            font-style: italic;
            border-radius: 10px;
            background-color: lightblue;
            box-shadow: -10px -10px 5px blue,2px 3px  navy;
        }

    </style>
</head>

<body>
    <div class="box-1">Box-1</div>
    <div class="box-2">Box-2</div>
    <div class="box-3">Box-3</div>
    <div class="box-4">Box-4</div>




</body>

</html>
