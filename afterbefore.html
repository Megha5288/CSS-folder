<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>after before</title>
    <style>
        h1{
            width: 200px;
            text-align: center;

        }
    h1::before {
        content: "I";
        display: block;
        background-color: orange;
    }
      h1::after{
        content: "India";
        display: block;
        background-color: green;
    </style>
</head>
<body>
    <h1>Love</h1>
</body>
</html>
