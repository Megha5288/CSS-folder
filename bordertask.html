<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shapes</title>
    
</head>
<style>
    #btn1{
        background-color: maroon;
        color: black;
        border: solid 5px magenta;
        height: 100px;
        width: 150px;
        border-radius: 0px;

    }
    #btn2{
        background-color: maroon;
        color: black;
        border: solid 5px magenta;
        height: 100px;
        width: 150px;
        border-radius: 45px;
    }
    #btn3{
        background-color: maroon;
        border: solid 5px magenta;
        height: 150px;
        width: 150px;
        border-radius: 100px;
    }
    #btn4{
        background-color: maroon;
        border: solid 5px magenta;
        height: 100px;
        width: 150px;
        border-top-left-radius: 20px;
        border-bottom-right-radius:20px;
    }
    #btn5{
        background-color: maroon;
        border: solid 5px magenta;
        height: 100px;
        width: 100px;
        border-top-left-radius: 90%;
    }
    
    #btn6{
        background-color: maroon;
        border: solid 5px magenta;
        height: 100px;
        width: 150px;
        border-radius: 30px;
    }
#btn8{
        background-color: maroon;
        border: solid 5px magenta;
        height: 100px;
        width: 150px;
        border-top-right-radius: 100px;
         border-top-left-radius: 100px;
    }
    #btn7{
        background-color: maroon;
        border: solid 5px magenta;
        height: 100px;
        width: 100px;
        border-top-left-radius: 100px;
        border-bottom-right-radius: 100px;

    }





</style>
<body>
    <div id="btn1"></div>
    <br>
    <div id="btn2"></div>
    <br>
    <div id="btn3"></div>
    <br>
    <div id="btn4"></div>
    <br>
    <div id="btn5"></div>
    <br>
    <div id="btn6"></div>
    <br>
    <div id="btn7"></div>
    <br>
    <div id="btn8"></div>

</body>
</html>
