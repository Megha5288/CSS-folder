<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: blue;
    }

    .navbar {
        width: 100%;
        height: 60px;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 25px;
        background-color: #292a2e;
        border-bottom: 1px solid #292a2e;
    }

    .nav-link {
        text-decoration: none;
        color: whitesmoke;
        font-size: 13px;
        padding: 9px 14px;
        border-radius: 20px;
    }

    .nav-link:hover {
        color: #ffffff;
        background-color: red;

    }

    .menu-icon {
        display: none;
        width: 24px;
        cursor: pointer;
        flex-direction: column;
        /* color: blue; */
    }

    .menu-icon span {
        display: block;
        width: 20px;
        height: 2px;
        background-color: #ffffff;
        border-radius: 2px;
        margin: 5px;
    }

    @media(max-width:600px) {

        .navbar {
            justify-content: space-between;
            padding: 15px 18px;
            position: relative;
        }

        .menu-icon {
            display: flex;
        }

        .nav-menu {
            position: absolute;
            top: 55px;
            right: 12px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 4px;

            padding: 12px;
            background-color: #111215;
            border: 1px solid #24252a;
            border-radius: 20px;
            width: 200px;


            opacity: 0;
            visibility: hidden;
            z-index: 100;
        }

        .nav-link {
            padding: 12px;
            border-radius: 20px;
        }

        .navbar:has(.menu-icon:hover) .nav-menu,
        .navbar:has(.menu-menu:hover) .nav-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    }
</style>

<body>
    <nav class="navbar">
        <a href="#" class="brand">Navbar</a>
        <input type="checkbox" id="menu-toggel">
        <label for="menu-toggle" class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="nav-menu">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link active">Features</a>
            <a href="#" class="nav-link active">Pricing</a>
            <a href="#" class="nav-link active">Disabled</a>
        </div>
    </nav>
</body>

</html>
